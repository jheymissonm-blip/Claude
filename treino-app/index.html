<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus Treinos</title>
  <style>
    :root {
      --bg: #f3f5f4; --card: #ffffff; --text: #14191f; --muted: #66707d;
      --accent: #0f9f8f; --accent-ink: #ffffff; --accent-soft: #dff5f1;
      --danger: #dc2626; --border: #e3e8e6; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1113; --card: #161c20; --text: #e8eeec; --muted: #8a9696;
        --accent: #2dd4bf; --accent-ink: #052e2a; --accent-soft: #123a36;
        --danger: #f87171; --border: #26302f; --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1113; --card: #161c20; --text: #e8eeec; --muted: #8a9696;
      --accent: #2dd4bf; --accent-ink: #052e2a; --accent-soft: #123a36;
      --danger: #f87171; --border: #26302f; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
      max-width: 640px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.4;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    header.topo { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; flex: 0 0 auto;
    }
    .topo h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
    .topo .sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
    h2 { font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; }
    h3 { font-size: .95rem; margin: 0 0 8px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .muted { color: var(--muted); font-size: .88rem; }
    input, select {
      font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; min-width: 0;
    }
    input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="text"] { flex: 1 1 160px; }
    input[type="number"] { width: 84px; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 11px 16px;
      cursor: pointer; background: var(--accent); color: var(--accent-ink); transition: transform .08s, opacity .15s;
    }
    button:active { transform: scale(.97); }
    button.ghost { background: var(--accent-soft); color: var(--accent); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    button.small { padding: 7px 11px; font-size: .84rem; border-radius: 10px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: .85rem; }

    .lista-treinos { display: grid; gap: 10px; }
    .treino-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .treino-card .info { min-width: 0; }
    .treino-card .info h2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px; margin-top: 6px;
    }

    ul { list-style: none; padding: 0; margin: 10px 0 0; }
    li {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border);
    }
    li strong { font-weight: 600; }
    .empty { text-align: center; color: var(--muted); padding: 32px 12px; }
    .hidden { display: none; }
    .add-form { margin-top: 14px; }

    /* Cronômetro */
    #timer {
      position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); z-index: 5;
      background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    #timer-display { font-size: 2.6rem; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    #timer.alerta #timer-display { color: var(--danger); animation: pisca 1s steps(2) infinite; }
    @keyframes pisca { 50% { opacity: .35; } }
    #timer-toggle { min-width: 110px; }
    .sugestao { padding: 12px 0; border-top: 1px solid var(--border); }
    .sugestao:first-of-type { border-top: 0; }
    .sugestao .alvo { font-weight: 600; }
    .sugestao .sug { display: inline-block; margin-top: 4px; font-size: .84rem; color: var(--accent); font-weight: 600; }
    @media (prefers-reduced-motion: reduce) { #timer.alerta #timer-display { animation: none; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="logo">MT</div>
    <div>
      <h1>Meus Treinos</h1>
      <div class="sub">Peito e pernas · 5 dias por semana</div>
    </div>
  </header>

  <!-- Cronômetro de descanso -->
  <div id="timer" class="card">
    <div class="row between">
      <div>
        <div class="muted">Descanso</div>
        <div id="timer-display">00:00</div>
      </div>
      <div class="chips">
        <button data-seg="30">30s</button>
        <button data-seg="60">60s</button>
        <button data-seg="90">90s</button>
        <button data-seg="120">2min</button>
        <button data-seg="180">3min</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="timer-toggle">Iniciar</button>
      <button class="ghost" id="timer-mais">+15s</button>
      <button class="danger" id="timer-zerar">Zerar</button>
    </div>
  </div>

  <!-- Criar treino -->
  <div class="card">
    <form id="form-treino" class="row">
      <input type="text" id="novo-treino" placeholder="Nome do treino (ex: Treino A)" required>
      <button type="submit">Criar treino</button>
    </form>
    <div class="row between" style="margin-top:12px">
      <span class="muted">Sem ideia de por onde começar?</span>
      <button class="ghost small" id="btn-plano">Adicionar plano de 5 dias</button>
    </div>
  </div>

  <!-- Lista de treinos -->
  <div id="lista-treinos"></div>

  <!-- Detalhe do treino -->
  <div id="detalhe" class="hidden"></div>

<script>
  // ---------- Constantes ----------
  const CHAVE = 'meus-treinos-v1';
  const GRUPOS = ['Peito', 'Costas', 'Pernas', 'Ombros', 'Bíceps', 'Tríceps', 'Abdômen'];

  // Exercícios sem equipamento, por grupo muscular
  const SEM_EQUIPAMENTO = {
    'Peito': [
      ['Flexão de braço', '3 × 8–15'],
      ['Flexão com pés elevados (declinada)', '3 × 8–12'],
      ['Flexão com mãos em apoio elevado (inclinada)', '3 × 10–15'],
      ['Flexão com mãos afastadas', '3 × 6–10']
    ],
    'Costas': [
      ['Superman (deitado de bruços)', '3 × 12–15'],
      ['Remada com toalha presa na porta', '3 × 10–12'],
      ['Remada invertida embaixo de mesa firme', '3 × 6–10'],
      ['Puxada de toalha (remada isométrica)', '3 × 20–30 s']
    ],
    'Pernas': [
      ['Agachamento livre', '3 × 15–20'],
      ['Agachamento búlgaro (pé de trás apoiado)', '3 × 8–12 por perna'],
      ['Avanço (passada)', '3 × 10–12 por perna'],
      ['Ponte de glúteos', '3 × 15–20'],
      ['Elevação de panturrilha no degrau', '3 × 15–25']
    ],
    'Ombros': [
      ['Flexão pike (ombros)', '3 × 6–10'],
      ['Elevação lateral com garrafas de água', '3 × 12–15'],
      ['Elevação frontal com garrafa', '3 × 10–12']
    ],
    'Bíceps': [
      ['Rosca com mochila cheia de livros', '3 × 10–12'],
      ['Rosca com garrafas de água', '3 × 12–15'],
      ['Isometria com toalha sob os pés', '3 × 20–30 s']
    ],
    'Tríceps': [
      ['Mergulho em cadeira ou banco', '3 × 8–15'],
      ['Flexão diamante (mãos juntas)', '3 × 6–10'],
      ['Extensão de tríceps com garrafa acima da cabeça', '3 × 10–12']
    ],
    'Abdômen': [
      ['Prancha', '3 × 20–40 s'],
      ['Abdominal supra', '3 × 15–20'],
      ['Abdominal bicicleta', '3 × 20 (total)'],
      ['Elevação de pernas deitado', '3 × 10–15'],
      ['Dead bug', '3 × 8–10 por lado']
    ]
  };

  // ---------- Armazenamento ----------
  function carregar() {
    try {
      return JSON.parse(localStorage.getItem(CHAVE)) || [];
    } catch (e) {
      return [];
    }
  }

  function salvar(treinos) {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(treinos));
    } catch (e) {
      alert('Não foi possível salvar neste navegador.');
    }
  }

  let treinos = carregar();
  let treinoAberto = null;   // id do treino em detalhe
  let grupoSugestao = 'Peito';

  function novoId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function escapar(texto) {
    const div = document.createElement('div');
    div.textContent = texto == null ? '' : String(texto);
    return div.innerHTML;
  }

  // ---------- Cronômetro de descanso ----------
  // Usa horário de término (Date.now), então continua certo mesmo com a aba em segundo plano.
  const timerEl = document.getElementById('timer');
  const timerDisplay = document.getElementById('timer-display');
  const timerToggle = document.getElementById('timer-toggle');
  let restanteMs = 0;     // tempo restante quando pausado
  let fimMs = null;       // horário de término quando rodando
  let intervalo = null;
  let audioCtx = null;

  function formatar(ms) {
    const total = Math.ceil(ms / 1000);
    const m = String(Math.floor(total / 60)).padStart(2, '0');
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function atualizarTimer() {
    const ms = fimMs !== null ? Math.max(0, fimMs - Date.now()) : restanteMs;
    timerDisplay.textContent = formatar(ms);
    if (fimMs !== null && ms <= 0) terminou();
  }

  function tocarAlerta() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.4, 0.8].forEach(t => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.3;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.2);
      });
    } catch (e) { /* sem áudio: segue só com vibração */ }
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  }

  function terminou() {
    pararIntervalo();
    fimMs = null;
    restanteMs = 0;
    timerEl.classList.add('alerta');
    timerToggle.textContent = 'Iniciar';
    timerDisplay.textContent = '00:00';
    tocarAlerta();
  }

  function pararIntervalo() {
    clearInterval(intervalo);
    intervalo = null;
  }

  function iniciarOuPausar() {
    timerEl.classList.remove('alerta');
    if (fimMs !== null) {
      // pausar
      restanteMs = Math.max(0, fimMs - Date.now());
      fimMs = null;
      pararIntervalo();
      timerToggle.textContent = 'Continuar';
    } else {
      if (restanteMs <= 0) return;
      // ao iniciar com um toque, o navegador libera o áudio
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume();
      } catch (e) {}
      fimMs = Date.now() + restanteMs;
      intervalo = setInterval(atualizarTimer, 250);
      timerToggle.textContent = 'Pausar';
    }
    atualizarTimer();
  }

  function definirTempo(seg) {
    pararIntervalo();
    fimMs = null;
    restanteMs = seg * 1000;
    timerEl.classList.remove('alerta');
    timerToggle.textContent = 'Iniciar';
    atualizarTimer();
  }

  function somarTempo(seg) {
    if (fimMs !== null) fimMs += seg * 1000;
    else restanteMs += seg * 1000;
    timerEl.classList.remove('alerta');
    atualizarTimer();
  }

  function zerarTimer() {
    pararIntervalo();
    fimMs = null;
    restanteMs = 0;
    timerEl.classList.remove('alerta');
    timerToggle.textContent = 'Iniciar';
    atualizarTimer();
  }

  timerToggle.addEventListener('click', iniciarOuPausar);
  document.getElementById('timer-mais').addEventListener('click', () => somarTempo(15));
  document.getElementById('timer-zerar').addEventListener('click', zerarTimer);
  document.querySelectorAll('[data-seg]').forEach(b =>
    b.addEventListener('click', () => definirTempo(Number(b.dataset.seg)))
  );

  // ---------- Renderização ----------
  function render() {
    const lista = document.getElementById('lista-treinos');
    const detalhe = document.getElementById('detalhe');

    if (treinoAberto) {
      lista.classList.add('hidden');
      detalhe.classList.remove('hidden');
      renderDetalhe();
      return;
    }

    detalhe.classList.add('hidden');
    lista.classList.remove('hidden');

    if (treinos.length === 0) {
      lista.innerHTML = '<div class="empty">Nenhum treino ainda. Crie o primeiro acima.</div>';
      return;
    }

    lista.innerHTML = '<div class="lista-treinos">' + treinos.map(t => `
      <div class="card treino-card">
        <div class="info">
          <h2>${escapar(t.nome)}</h2>
          <span class="badge">${t.exercicios.length} exercício(s)</span>
        </div>
        <div class="row">
          <button class="ghost small" onclick="abrir('${t.id}')">Abrir</button>
          <button class="danger small" onclick="excluirTreino('${t.id}')">Excluir</button>
        </div>
      </div>
    `).join('') + '</div>';
  }

  function renderDetalhe() {
    const t = treinos.find(x => x.id === treinoAberto);
    const detalhe = document.getElementById('detalhe');
    if (!t) { treinoAberto = null; render(); return; }

    const exercicios = t.exercicios.length
      ? `<ul>${t.exercicios.map(e => `
          <li>
            <div>
              <strong>${escapar(e.nome)}</strong>
              <div class="muted">${escapar(e.grupo || 'Sem grupo')} · ${e.series} série(s) × ${e.repeticoes} rep${e.carga ? ' · ' + escapar(e.carga) : ''}</div>
            </div>
            <div class="row">
              <button class="ghost small" onclick="verSugestoes('${e.grupo || ''}')">Sem equipamento?</button>
              <button class="danger small" onclick="excluirExercicio('${t.id}','${e.id}')">Remover</button>
            </div>
          </li>`).join('')}</ul>`
      : '<div class="empty">Nenhum exercício ainda.</div>';

    const opcoesGrupo = GRUPOS.map(g => `<option>${g}</option>`).join('');

    detalhe.innerHTML = `
      <div class="row between">
        <h1>${escapar(t.nome)}</h1>
        <button class="ghost" onclick="fechar()">← Voltar</button>
      </div>

      <div class="card">
        ${exercicios}
        <form id="form-exercicio" class="add-form row">
          <input type="text" id="ex-nome" placeholder="Exercício (ex: Supino)" required>
          <select id="ex-grupo">${opcoesGrupo}</select>
          <input type="number" id="ex-series" placeholder="Séries" min="1" value="3" required>
          <input type="number" id="ex-reps" placeholder="Reps" min="1" value="10" required>
          <input type="text" id="ex-carga" placeholder="Carga (opcional, ex: 20kg)">
          <button type="submit">Adicionar</button>
        </form>
      </div>

      <div class="card">
        <h3>Sugestões sem equipamento</h3>
        <div class="row">
          <select id="sel-grupo">${opcoesGrupo}</select>
        </div>
        <div id="sugestoes"></div>
      </div>
    `;

    document.getElementById('sel-grupo').value = grupoSugestao;
    document.getElementById('sel-grupo').addEventListener('change', e => {
      grupoSugestao = e.target.value;
      renderSugestoes();
    });
    renderSugestoes();

    document.getElementById('form-exercicio').addEventListener('submit', e => {
      e.preventDefault();
      const nome = document.getElementById('ex-nome').value.trim();
      if (!nome) return;
      t.exercicios.push({
        id: novoId(),
        nome,
        grupo: document.getElementById('ex-grupo').value,
        series: Number(document.getElementById('ex-series').value) || 1,
        repeticoes: Number(document.getElementById('ex-reps').value) || 1,
        carga: document.getElementById('ex-carga').value.trim()
      });
      salvar(treinos);
      render();
    });
  }

  function renderSugestoes() {
    const alvo = document.getElementById('sugestoes');
    if (!alvo) return;
    const lista = SEM_EQUIPAMENTO[grupoSugestao] || [];
    alvo.innerHTML = lista.map(([nome, sugestao]) => `
      <div class="sugestao">
        <div class="alvo">${escapar(nome)}</div>
        <span class="sug">${escapar(sugestao)}</span>
      </div>
    `).join('');
  }

  // ---------- Ações ----------
  function abrir(id) { treinoAberto = id; render(); window.scrollTo(0, 0); }
  function fechar() { treinoAberto = null; render(); }

  // Botão "Sem equipamento?" de um exercício: mostra as alternativas do grupo dele
  function verSugestoes(grupo) {
    if (GRUPOS.includes(grupo)) grupoSugestao = grupo;
    renderDetalhe();
    document.getElementById('sugestoes')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function excluirTreino(id) {
    const t = treinos.find(x => x.id === id);
    if (!t || !confirm(`Excluir o treino "${t.nome}"?`)) return;
    treinos = treinos.filter(x => x.id !== id);
    salvar(treinos);
    render();
  }

  function excluirExercicio(treinoId, exId) {
    const t = treinos.find(x => x.id === treinoId);
    if (!t) return;
    t.exercicios = t.exercicios.filter(e => e.id !== exId);
    salvar(treinos);
    render();
  }

  document.getElementById('form-treino').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('novo-treino');
    const nome = input.value.trim();
    if (!nome) return;
    treinos.push({ id: novoId(), nome, exercicios: [] });
    salvar(treinos);
    input.value = '';
    render();
  });


  // ---------- Plano de 5 dias: peito e pernas (máquinas e exercícios apoiados) ----------
  // Cada exercício: [nome, grupo, séries, repetições]
  const PLANO = [
    { nome: 'Segunda · Peito', exercicios: [
      ['Supino reto na máquina ou com barra', 'Peito', 4, '8–10'],
      ['Supino inclinado com halteres', 'Peito', 3, '10–12'],
      ['Crucifixo na máquina (peck deck)', 'Peito', 3, '12–15']
    ]},
    { nome: 'Terça · Pernas', exercicios: [
      ['Leg press 45°', 'Pernas', 4, '10–12'],
      ['Cadeira extensora', 'Pernas', 3, '12–15'],
      ['Cadeira flexora', 'Pernas', 3, '10–12'],
      ['Panturrilha sentado', 'Pernas', 3, '12–15']
    ]},
    { nome: 'Quarta · Peito', exercicios: [
      ['Supino inclinado com barra', 'Peito', 4, '8–10'],
      ['Supino reto com halteres', 'Peito', 3, '10–12'],
      ['Crucifixo inclinado com halteres', 'Peito', 3, '12–15']
    ]},
    { nome: 'Quinta · Pernas', exercicios: [
      ['Agachamento no Smith (apoiado)', 'Pernas', 4, '8–10'],
      ['Stiff com halteres', 'Pernas', 3, '10–12'],
      ['Cadeira flexora', 'Pernas', 3, '12–15'],
      ['Cadeira abdutora', 'Pernas', 3, '15']
    ]},
    { nome: 'Sexta · Peito e pernas', exercicios: [
      ['Supino na máquina', 'Peito', 3, '10–12'],
      ['Crossover (polia)', 'Peito', 3, '12–15'],
      ['Leg press com pés altos', 'Pernas', 3, '12–15'],
      ['Cadeira extensora', 'Pernas', 2, '15–20']
    ]}
  ];

  document.getElementById('btn-plano').addEventListener('click', () => {
    if (!confirm('Adicionar os 5 treinos do plano à sua lista?')) return;
    PLANO.forEach(t => treinos.push({
      id: novoId(),
      nome: t.nome,
      exercicios: t.exercicios.map(([nome, grupo, series, repeticoes]) => ({
        id: novoId(), nome, grupo, series, repeticoes, carga: ''
      }))
    }));
    salvar(treinos);
    render();
  });

  render();
</script>
</body>
</html>
