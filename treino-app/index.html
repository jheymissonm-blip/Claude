<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus Treinos</title>
  <style>
    :root {
      --bg: #f3f5f4; --card: #ffffff; --text: #14191f; --muted: #66707d;
      --accent: #0f9f8f; --accent-ink: #ffffff; --accent-soft: #dff5f1;
      --danger: #dc2626; --border: #e3e8e6;
      --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1113; --card: #161c20; --text: #e8eeec; --muted: #8a9696;
        --accent: #2dd4bf; --accent-ink: #052e2a; --accent-soft: #123a36;
        --danger: #f87171; --border: #26302f; --shadow: 0 1px 2px rgba(0,0,0,.4);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0d1113; --card: #161c20; --text: #e8eeec; --muted: #8a9696;
      --accent: #2dd4bf; --accent-ink: #052e2a; --accent-soft: #123a36;
      --danger: #f87171; --border: #26302f; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
      max-width: 640px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.4;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.02em; }
    h2 { font-size: 1.15rem; margin: 0; letter-spacing: -0.01em; }
    h3 { font-size: 1rem; margin: 0 0 8px; }
    button, input, select { font: inherit; }
    input, select {
      color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 12px; padding: 11px 12px; min-width: 0;
    }
    input:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type="number"] { width: 84px; }

    header.topo { display: flex; align-items: center; gap: 12px; margin: 8px 0 18px; }
    .logo {
      width: 44px; height: 44px; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
      display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; flex: 0 0 auto;
    }
    .topo .titulo { flex: 1; min-width: 0; }
    .sub { color: var(--muted); font-size: .88rem; margin-top: 2px; }
    .link-planilha {
      color: var(--accent); font-weight: 600; font-size: .85rem; text-decoration: none;
      border: 1px solid var(--border); padding: 8px 12px; border-radius: 12px; white-space: nowrap;
    }
    .muted { color: var(--muted); font-size: .88rem; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .small-gap { gap: 8px; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .vazio { text-align: center; color: var(--muted); padding: 24px 12px; }
    .badge {
      display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 999px;
    }

    button {
      border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; font-weight: 600;
      background: var(--accent); color: var(--accent-ink); transition: transform .08s, opacity .15s;
    }
    button:active { transform: scale(.97); }
    button.ghost { background: var(--accent-soft); color: var(--accent); }
    button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    button.small { padding: 7px 11px; font-size: .84rem; border-radius: 10px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chips button {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 999px; font-weight: 600; font-size: .85rem;
    }
    .chips button.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

    /* Cronômetro */
    #timer {
      position: sticky; top: max(8px, env(safe-area-inset-top, 0px)); z-index: 5;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
    }
    .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    #timer-display { font-size: 2.6rem; font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
    #timer.alerta #timer-display { color: var(--danger); animation: pisca 1s steps(2) infinite; }
    @keyframes pisca { 50% { opacity: .35; } }
    .barra { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 12px; }
    #timer-barra { height: 100%; background: var(--accent); transition: width .25s linear; }
    #timer-presets { margin-top: 12px; }

    /* Abas de treino */
    .abas { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
    .abas::-webkit-scrollbar { display: none; }
    .aba {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 14px; min-width: 130px; text-align: left;
    }
    .aba.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .aba-dia { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .8; }
    .aba-nome { font-weight: 600; font-size: .9rem; white-space: nowrap; }

    .cabeca .progresso { text-align: right; }
    .progresso b { font-variant-numeric: tabular-nums; }

    /* Exercícios */
    .ex h3 { margin: 8px 0 10px; font-size: 1.02rem; }
    .ex.concluido { border-color: var(--accent); }
    .acoes { gap: 6px; margin-bottom: 12px; }
    .sets-row { border-top: 1px solid var(--border); padding-top: 12px; gap: 10px; }
    .sets { display: flex; gap: 6px; flex-wrap: wrap; }
    .set {
      min-width: 44px; height: 40px; padding: 0 10px; border-radius: 10px;
      background: var(--bg); color: var(--text); border: 1px solid var(--border); font-weight: 700; font-size: .85rem;
    }
    .set.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .carga { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
    .carga input { width: 84px; }

    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-form input[name="nome"] { grid-column: 1 / -1; }
    .form-ex button { margin-top: 10px; }

    .sugestao { padding: 12px 0; border-top: 1px solid var(--border); }
    .sugestao:first-of-type { border-top: 0; }
    .sugestao .alvo { font-weight: 600; }
    .sugestao .sug { display: inline-block; margin-top: 4px; font-size: .84rem; color: var(--accent); font-weight: 600; }

    /* Modal de movimento */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 18px; max-width: 480px; width: 100%; max-height: 90vh; overflow: auto;
    }
    .svgbox { background: var(--bg); border-radius: 14px; padding: 12px; margin: 12px 0; text-align: center; }
    .svgbox svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
    .anim-arrow { animation: pulseArrow 1.5s ease-in-out infinite; }
    @keyframes pulseArrow {
      0%, 100% { transform: translate(0, 0); opacity: .9; }
      50% { transform: translate(var(--dx, 0px), var(--dy, -8px)); opacity: 1; }
    }
    .modal p { margin: 8px 0; font-size: .95rem; }
    .btn-video {
      background: #dc2626; color: #fff; text-decoration: none; padding: 11px 16px; border-radius: 12px; font-weight: 600;
    }
    @media (prefers-reduced-motion: reduce) { .anim-arrow, #timer.alerta #timer-display { animation: none; } }
  </style>
</head>
<body>
  <header class="topo">
    <div class="logo">MT</div>
    <div class="titulo">
      <h1>Meus Treinos</h1>
      <div class="sub">Peito, pernas e o restante · máquinas e polias</div>
    </div>
    <a class="link-planilha" href="https://docs.google.com/spreadsheets/d/1Wc6pv3R_wqTu-gtCEkiAfxPCWa9GTBe-Sr5mHP959KA/edit" target="_blank" rel="noopener noreferrer">Planilha</a>
  </header>

  <!-- Cronômetro de descanso -->
  <section id="timer" class="card">
    <div class="row between">
      <div>
        <div class="label">Descanso</div>
        <div id="timer-display">01:30</div>
      </div>
      <div class="row">
        <button id="timer-toggle" type="button">Iniciar</button>
        <button id="timer-mais" type="button" class="ghost">+15s</button>
        <button id="timer-zerar" type="button" class="danger">Zerar</button>
      </div>
    </div>
    <div class="chips" id="timer-presets"></div>
    <div class="barra"><div id="timer-barra" style="width:100%"></div></div>
  </section>

  <!-- Abas dos treinos -->
  <nav id="abas" class="abas" aria-label="Treinos"></nav>

  <!-- Treino ativo -->
  <section id="treino"></section>

  <!-- Criar treino e restaurar plano -->
  <section id="geral"></section>

  <!-- Modal de movimento -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
    <div class="modal-box">
      <div class="row between" style="align-items:flex-start">
        <div>
          <span id="modal-equip" class="badge"></span>
          <h3 id="modal-titulo" style="margin-top:8px;font-size:1.2rem"></h3>
        </div>
        <button id="modal-fechar" type="button" class="ghost small" aria-label="Fechar">✕</button>
      </div>
      <div id="modal-svg" class="svgbox"></div>
      <p><strong>Ajuste e postura:</strong> <span id="modal-setup"></span></p>
      <p><strong>Execução:</strong> <span id="modal-cue"></span></p>
      <div class="row between" style="margin-top:16px">
        <a id="modal-video" class="btn-video" target="_blank" rel="noopener noreferrer">Assistir vídeo</a>
        <button id="modal-ok" type="button" class="ghost">Fechar</button>
      </div>
    </div>
  </div>

<script>
  // ---------- Constantes ----------
  const CHAVE = 'treinos-app-v3';
  const GRUPOS = ['Peito', 'Pernas', 'Costas', 'Ombros', 'Bíceps', 'Tríceps', 'Abdômen'];
  const TEMPOS = [30, 60, 75, 90, 120, 150, 180];

  // Exercício: id, nome, grupo, equipamento, séries, reps, descanso (s), movimento, ajuste, execução, vídeo
  function ex(id, nome, grupo, equip, series, reps, descanso, motion, setup, cue, video) {
    return { id, nome, grupo, equip, series, reps, descanso, motion, setup, cue, video };
  }

  // Plano padrão: 5 dias de peito e pernas em máquinas
  const PLANO_PADRAO = [
    { id: 'd1', nome: 'Peito + Tríceps', subtitulo: 'Foco em peitoral · 20 séries · ~58 min · Máquinas e polia', exercicios: [
      ex('d1_1', 'Supino reto na máquina', 'Peito', 'Máquina Articulada', 4, '8-10', 120, 'push_horiz', 'Regule o banco para que as manoplas fiquem alinhadas ao meio do peitoral.', 'Escápulas apoiadas, empurre à frente sem travar cotovelos e segure 2s na volta.', 'https://www.youtube.com/watch?v=bKSvckCwvh4'),
      ex('d1_2', 'Supino inclinado no Smith', 'Peito', 'Barra Guiada (Smith)', 4, '8-12', 120, 'push_incline', 'Banco a 30 graus centralizado para a barra descer na parte superior do peito.', 'Desça controlado até perto do peitoral superior e suba em linha reta com firmeza.', 'https://www.youtube.com/watch?v=WGdi4iTfza8'),
      ex('d1_3', 'Peck Deck (Voador)', 'Peito', 'Máquina', 3, '12-15', 75, 'fly', 'Manoplas na altura dos ombros; costas e cabeça totalmente encostadas.', 'Feche os braços mantendo cotovelos levemente dobrados, sem projetar os ombros à frente.', 'https://www.youtube.com/watch?v=FwtqdGlRgig'),
      ex('d1_4', 'Cross-over polia baixa/média', 'Peito', 'Polia Dupla', 3, '12-15', 60, 'fly', 'Polias na altura da cintura/quadril para tensão contínua em alongamento.', 'Feche à frente do peito controlando a abertura na volta.', 'https://www.youtube.com/watch?v=jqTlJt3JXzQ'),
      ex('d1_5', 'Tríceps francês + Barra (Bi-set)', 'Tríceps', 'Polia Alta', 6, '10-12', 75, 'push_down', 'Faça 3 séries de francês acima da cabeça (Maeo 2023) seguidas de 3 séries na barra.', 'Priorize o alongamento completo atrás da cabeça antes de ir para a barra reta.', 'https://www.youtube.com/watch?v=O3rDfWaXhhs')
    ]},
    { id: 'd2', nome: 'Pernas (Quadríceps)', subtitulo: 'Coxas frontais e panturrilha · 21 séries · ~58 min', exercicios: [
      ex('d2_1', 'Hack Squat na máquina', 'Pernas', 'Máquina Hack', 4, '8-10', 150, 'squat_down', 'Ombros firmes sob as almofadas, lombar encostada e pés na largura dos ombros.', 'Desça controlando até os joelhos passarem de 90 graus e empurre pelos calcanhares.', 'https://www.youtube.com/watch?v=LeAgTrHfWuo'),
      ex('d2_2', 'Leg Press 45 graus', 'Pernas', 'Máquina Leg Press', 4, '10-12', 120, 'leg_press', 'Pés na parte média/baixa da plataforma; quadril bem apoiado no assento.', 'Desça até quase encostar os joelhos no peito sem tirar o quadril do banco.', 'https://www.youtube.com/watch?v=bfHuhQPa4lc'),
      ex('d2_3', 'Cadeira extensora', 'Pernas', 'Máquina', 4, '12-15', 75, 'leg_ext', 'Alinhe o eixo da máquina ao joelho; encosto levemente reclinado alonga o reto femoral.', 'Suba estendendo totalmente o joelho, segure 1s no topo e desça devagar.', 'https://www.youtube.com/watch?v=el3oHblB5DM'),
      ex('d2_4', 'Cadeira adutora', 'Pernas', 'Máquina', 3, '12-15', 60, 'adduct', 'Costas apoiadas, ajuste a abertura inicial sem causar desconforto na virilha.', 'Feche as pernas com força controlada e segure a volta sem bater as placas.', 'https://www.youtube.com/watch?v=Wf602gn_9zU'),
      ex('d2_5', 'Panturrilha Leg + Abdômen (Bi-set)', 'Pernas', 'Máquinas', 6, '12-15', 60, 'calf', '4 séries de panturrilha com joelho estendido (Kinoshita 2023) + 2 séries de abdômen.', 'Pausa de 1s no alongamento máximo do tornozelo.', 'https://www.youtube.com/watch?v=bfHuhQPa4lc')
    ]},
    { id: 'd3', nome: 'Costas + Ombros', subtitulo: 'Puxada e deltoides · 21 séries · ~58 min', exercicios: [
      ex('d3_1', 'Puxada alta aberta', 'Costas', 'Polia Alta', 4, '8-10', 90, 'pull_down', 'Trave bem as coxas no apoio; pegada pouco mais aberta que os ombros.', 'Puxe a barra em direção ao peitoral superior levando os cotovelos para baixo e para trás.', 'https://www.youtube.com/watch?v=SapM-j_3M20'),
      ex('d3_2', 'Remada articulada apoiada', 'Costas', 'Máquina', 4, '10-12', 90, 'pull_row', 'Regule o banco para o peito ficar firme no apoio sem comprimir a respiração.', 'Puxe as manoplas trazendo as escápulas para trás; evite girar o tronco.', 'https://www.youtube.com/watch?v=Sq7rWvJtzDY'),
      ex('d3_3', 'Desenvolvimento na máquina', 'Ombros', 'Máquina', 3, '8-10', 90, 'push_up', 'Ajuste o assento para as manoplas iniciarem na altura das orelhas/ombros.', 'Empurre para cima mantendo a lombar neutra encostada no banco.', 'https://www.youtube.com/watch?v=Xd5bgkvYdfk'),
      ex('d3_4', 'Elevação lateral na polia', 'Ombros', 'Polia Baixa', 4, '12-15', 60, 'lat_raise', 'Fique de lado para a polia baixa com o cabo passando por trás do corpo.', 'Eleve o braço lateralmente até a altura do ombro sem encolher o trapézio.', 'https://www.youtube.com/watch?v=3vbYw9xklBc'),
      ex('d3_5', 'Rosca polia + Rosca corda (Bi-set)', 'Bíceps', 'Polia Baixa', 6, '10-12', 75, 'curl_up', '3 séries na barra reta/W seguidas de 3 séries na corda (martelo).', 'Cotovelos colados ao tronco, subida controlada.', 'https://www.youtube.com/watch?v=zqklqTcOsbo')
    ]},
    { id: 'd4', nome: 'Pernas (Posteriores)', subtitulo: 'Posterior, glúteos e core · 21 séries · ~58 min', exercicios: [

      ex('d4_2', 'Mesa flexora', 'Pernas', 'Máquina', 3, '10-12', 90, 'leg_curl', 'Alinhe os joelhos com o eixo da máquina e apoie o rolo acima dos calcanhares.', 'Puxe o rolo em direção aos glúteos mantendo o quadril pressionado contra o banco.', 'https://www.youtube.com/watch?v=2-ULaRrQa7c'),
      ex('d4_3', 'Leg Press 45° (pés altos)', 'Pernas', 'Máquina Leg Press', 4, '10-12', 120, 'leg_press', 'Posicione os pés mais altos na plataforma para enfatizar glúteos e posteriores.', 'Desça controlando o peso e empurre pelos calcanhares sem levantar o quadril.', 'https://www.youtube.com/watch?v=bfHuhQPa4lc'),
      ex('d4_4', 'Cadeira abdutora', 'Pernas', 'Máquina', 3, '12-15', 60, 'abduct', 'Costas apoiadas ou tronco levemente inclinado à frente para maior ativação glútea.', 'Empurre os apoios para fora abrindo os joelhos e retorne devagar.', 'https://www.youtube.com/watch?v=e2gmqTG1OgQ'),
      ex('d4_5', 'Panturrilha + Abdominal (Bi-set)', 'Pernas', 'Máquinas', 7, '15', 60, 'calf', '4 séries de panturrilha com joelho estendido + 3 séries de abdominal na polia/máquina.', 'Amplitude máxima no tornozelo e flexão real da coluna no abdominal.', 'https://www.youtube.com/watch?v=e2gmqTG1OgQ')
    ]},
    { id: 'd5', nome: 'Peito + Superiores', subtitulo: '2º estímulo de peitoral e acabamento · 21 séries · ~58 min', exercicios: [
      ex('d5_1', 'Supino inclinado na máquina', 'Peito', 'Máquina Articulada', 4, '8-10', 120, 'push_incline', 'Banco ajustado para empurrar em ângulo diagonal ascendente.', 'Mantenha ombros baixos e escápulas firmes no encosto durante toda a série.', 'https://www.youtube.com/watch?v=WGdi4iTfza8'),
      ex('d5_2', 'Cross-over na polia alta', 'Peito', 'Polia Dupla', 3, '12-15', 75, 'fly', 'Polias acima da cabeça, dê um passo à frente para estabilizar a base.', 'Feche os braços em arco à frente do umbigo mantendo cotovelos semiflexionados.', 'https://www.youtube.com/watch?v=jqTlJt3JXzQ'),
      ex('d5_3', 'Puxada baixa neutra (triângulo)', 'Costas', 'Polia Baixa', 4, '10-12', 90, 'pull_row', 'Pés firmes no apoio, joelhos semiflexionados e coluna reta.', 'Alongue bem os dorsais à frente e puxe o triângulo em direção ao umbigo.', 'https://www.youtube.com/watch?v=_K0I9tOnOdk'),
      ex('d5_4', 'Crucifixo inverso no Peck Deck', 'Ombros', 'Máquina', 4, '12-15', 60, 'abduct', 'Sente de frente para o encosto com as manoplas na altura dos ombros.', 'Abra os braços para trás focando na parte posterior dos ombros.', 'https://www.youtube.com/watch?v=FwtqdGlRgig'),
      ex('d5_5', 'Elevação lateral + Tríceps francês', 'Ombros', 'Polia (Bi-set)', 6, '12', 75, 'push_up', '3 séries de elevação lateral na polia + 3 séries de tríceps francês na corda.', 'Execute os dois movimentos com controle excêntrico sem roubar com o tronco.', 'https://www.youtube.com/watch?v=O3rDfWaXhhs')

  // Exercícios de academia por grupo, para troca: [nome, equipamento, movimento]
  const CATALOGO = {
    'Peito': [
      ['Supino reto na máquina', 'Máquina Articulada', 'push_horiz'],
      ['Supino reto com barra', 'Barra', 'push_horiz'],
      ['Supino reto com halteres', 'Halteres', 'push_horiz'],
      ['Supino inclinado no Smith', 'Barra Guiada (Smith)', 'push_incline'],
      ['Supino inclinado com halteres', 'Halteres', 'push_incline'],
      ['Supino inclinado na máquina', 'Máquina Articulada', 'push_incline'],
      ['Crucifixo na máquina (Peck Deck)', 'Máquina', 'fly'],
      ['Crucifixo com halteres', 'Halteres', 'fly'],
      ['Cross-over na polia', 'Polia Dupla', 'fly']
    ],
    'Pernas': [
      ['Hack Squat na máquina', 'Máquina Hack', 'squat_down'],
      ['Agachamento no Smith', 'Barra Guiada (Smith)', 'squat_down'],
      ['Agachamento livre com barra', 'Barra', 'squat_down'],
      ['Leg Press 45 graus', 'Máquina Leg Press', 'leg_press'],
      ['Leg Press horizontal', 'Máquina Leg Press', 'leg_press'],
      ['Cadeira extensora', 'Máquina', 'leg_ext'],
      ['Cadeira flexora', 'Máquina', 'leg_curl'],
      ['Mesa flexora', 'Máquina', 'leg_curl'],
      ['Stiff com barra', 'Barra', null],

  // ---------- Utilidades ----------
  function esc(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
  }
  function novoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function linkBusca(nome) {
    return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(nome + ' execução academia');
  }

  // ---------- Estado e armazenamento ----------
  let estado = { treinos: [], ativo: 'd1', marcadas: {}, cargas: {} };
  let trocando = null;            // {treinoId, exId} enquanto escolhe a troca
  let grupoSugestao = 'Peito';
  let pendente = null, tPendente = null;

  function carregarEstado() {
    try {
      const s = JSON.parse(localStorage.getItem(CHAVE));
      if (s && Array.isArray(s.treinos)) {
        return { treinos: s.treinos, ativo: s.ativo, marcadas: s.marcadas || {}, cargas: s.cargas || {} };
      }
    } catch (e) {}
    return { treinos: JSON.parse(JSON.stringify(PLANO_PADRAO)), ativo: 'd1', marcadas: {}, cargas: {} };
  }
  function salvarEstado() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {}
  }
  function treinoAtivo() { return estado.treinos.find(t => t.id === estado.ativo) || null; }
  function feitasDoExercicio(exercicio) {
    return (estado.marcadas[exercicio.id] || []).slice(0, exercicio.series).filter(Boolean).length;
  }
  function alternativasDe(exercicio) {
    return (CATALOGO[exercicio.grupo] || []).filter(c => c[0] !== exercicio.nome);
  }
  // Confirmação sem caixa de diálogo: o primeiro toque pede o segundo
  function rotulo(chave, normal) { return pendente === chave ? 'Toque de novo para confirmar' : normal; }
  function confirmar(chave, acao) {
    if (pendente === chave) { pendente = null; clearTimeout(tPendente); acao(); return; }
    pendente = chave;
    clearTimeout(tPendente);
    tPendente = setTimeout(() => { pendente = null; render(); }, 3000);
    render();
  }

  // ---------- Cronômetro de descanso ----------
  // Usa horário de término, então continua certo com a aba em segundo plano.
  let timerSeg = 90;
  let restanteMs = 90000;
  let fimMs = null;
  let pausado = false;
  let intervalo = null;
  let audioCtx = null;

  function fmt(ms) {
    const t = Math.ceil(ms / 1000);
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  function desbloquearAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.resume) audioCtx.resume();
    } catch (e) {}
  }
  function pararTick() { clearInterval(intervalo); intervalo = null; }
  function desenharTimer() {
    const ms = fimMs !== null ? Math.max(0, fimMs - Date.now()) : restanteMs;
    document.getElementById('timer-display').textContent = fmt(ms);
    const pct = timerSeg > 0 ? Math.max(0, Math.min(100, (ms / (timerSeg * 1000)) * 100)) : 0;
    document.getElementById('timer-barra').style.width = pct + '%';
    let txt = 'Iniciar';
    if (fimMs !== null) txt = 'Pausar';
    else if (pausado) txt = 'Continuar';
    document.getElementById('timer-toggle').textContent = txt;
  }
  function marcarPresets() {
    document.getElementById('timer-presets').innerHTML = TEMPOS.map(s => {
      const label = s >= 120 && s % 60 === 0 ? (s / 60) + 'min' : s + 's';
      return `<button type="button" data-seg="${s}" class="${s === timerSeg ? 'on' : ''}">${label}</button>`;
    }).join('');
  }
  function alertar() {
    try {
      desbloquearAudio();
      const ctx = audioCtx;
      [0, 0.4, 0.8].forEach(t => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.3;
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + 0.2);
      });
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
    document.getElementById('timer').classList.add('alerta');
  }
  function tick() {
    if (fimMs === null) return;
    if (Date.now() >= fimMs) {
      fimMs = null; restanteMs = 0; pausado = false;
      pararTick();
      alertar();
    }
    desenharTimer();
  }
  function iniciar() {
    desbloquearAudio();
    if (restanteMs <= 0) restanteMs = timerSeg * 1000;
    fimMs = Date.now() + restanteMs;
    pausado = false;
    document.getElementById('timer').classList.remove('alerta');
    pararTick();
    intervalo = setInterval(tick, 250);
    desenharTimer();
  }
  function iniciarTimer(seg) {
    timerSeg = seg;
    restanteMs = seg * 1000;
    marcarPresets();
    iniciar();
  }
  function alternarTimer() {
    if (fimMs !== null) {
      restanteMs = Math.max(0, fimMs - Date.now());
      fimMs = null; pausado = true;
      pararTick();
      desenharTimer();
    } else {
      iniciar();
    }
  }
  function zerarTimer() {
    fimMs = null; pausado = false;
    pararTick();
    restanteMs = timerSeg * 1000;
    document.getElementById('timer').classList.remove('alerta');
    desenharTimer();
  }

  document.getElementById('timer-toggle').addEventListener('click', alternarTimer);
  document.getElementById('timer-zerar').addEventListener('click', zerarTimer);
  document.getElementById('timer-mais').addEventListener('click', () => {
    if (fimMs !== null) fimMs += 15000; else restanteMs += 15000;
    desenharTimer();
  });
  document.getElementById('timer-presets').addEventListener('click', e => {
    const b = e.target.closest('button[data-seg]');
    if (!b) return;
    timerSeg = Number(b.dataset.seg);
    restanteMs = timerSeg * 1000;
    fimMs = null; pausado = false;
    pararTick();
    document.getElementById('timer').classList.remove('alerta');
    marcarPresets();
    desenharTimer();
  });

  // ---------- Renderização ----------
  function render() { renderAbas(); renderTreino(); renderGeral(); }

  function renderAbas() {
    const ativo = treinoAtivo();
    document.getElementById('abas').innerHTML = estado.treinos.map((t, i) => `
      <button type="button" class="aba ${ativo && t.id === ativo.id ? 'on' : ''}" data-aba="${esc(t.id)}">
        <span class="aba-dia">Dia ${i + 1}</span>
        <span class="aba-nome">${esc(t.nome)}</span>
      </button>`).join('') || '<span class="muted">Nenhum treino. Crie um abaixo.</span>';
  }

  function painelTroca(t) {
    if (!trocando || trocando.treinoId !== t.id) return '';
    const exercicio = t.exercicios.find(x => x.id === trocando.exId);
    if (!exercicio) { trocando = null; return ''; }
    const alts = alternativasDe(exercicio);
    const botoes = alts.length
      ? `<div class="chips" style="margin-top:12px">${alts.map((c, i) =>
          `<button type="button" data-trocar-para="${i}">${esc(c[0])}</button>`).join('')}</div>`
      : '<div class="muted" style="margin-top:12px">Não há alternativas cadastradas para este grupo.</div>';
    return `
      <div class="card" id="painel-troca">
        <h3>Trocar "${esc(exercicio.nome)}" por:</h3>
        <div class="muted">Exercícios do grupo ${esc(exercicio.grupo || 'sem grupo')}. Escolha o que tem na sua academia; séries, repetições e descanso são mantidos.</div>
        ${botoes}
        <div class="row" style="margin-top:14px"><button type="button" class="ghost small" data-acao="cancelar-troca">Cancelar</button></div>
      </div>`;
  }

  function cardExercicio(exercicio) {
    const marc = estado.marcadas[exercicio.id] || [];
    const feitas = feitasDoExercicio(exercicio);
    const sets = Array.from({ length: exercicio.series }, (_, i) =>
      `<button type="button" class="set ${marc[i] ? 'on' : ''}" data-set="${esc(exercicio.id)}" data-idx="${i}" data-descanso="${exercicio.descanso}" aria-pressed="${marc[i] ? 'true' : 'false'}">S${i + 1}</button>`
    ).join('');
    const desc = exercicio.descanso === 0 ? 'Bi-set (0s)' : `${exercicio.descanso}s`;
    const carga = estado.cargas[exercicio.id] == null ? '' : estado.cargas[exercicio.id];
    return `
      <article class="card ex ${feitas >= exercicio.series ? 'concluido' : ''}">
        <div class="row small-gap">
          <span class="badge">${esc(exercicio.equip)}</span>
          <span class="muted">${exercicio.series} séries · ${esc(exercicio.reps)} reps · Descanso: ${desc}</span>
        </div>
        <h3>${esc(exercicio.nome)}</h3>
        <div class="row acoes">
          <button type="button" class="ghost small" data-acao="movimento" data-ex="${esc(exercicio.id)}">▶ Ver movimento</button>
          <button type="button" class="ghost small" data-acao="trocar" data-ex="${esc(exercicio.id)}">Trocar</button>
          <button type="button" class="ghost small" data-acao="sem-equip" data-grupo="${esc(exercicio.grupo)}">Sem equipamento?</button>
          <button type="button" class="danger small" data-acao="remover-ex" data-ex="${esc(exercicio.id)}">${rotulo('remover-ex:' + exercicio.id, 'Remover')}</button>
        </div>
        <div class="row between sets-row">
          <div class="sets">${sets}</div>
          <label class="carga"><span>Carga (kg)</span>
            <input type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" data-carga="${esc(exercicio.id)}" value="${esc(carga)}">
          </label>
        </div>
      </article>`;
  }

  function cardSemEquipamento() {
    const lista = (SEM_EQUIPAMENTO[grupoSugestao] || []).map(([nome, sug]) =>
      `<div class="sugestao"><div class="alvo">${esc(nome)}</div><span class="sug">${esc(sug)}</span></div>`).join('');
    return `
      <div class="card" id="sem-equip">
        <h3>Sugestões sem equipamento</h3>
        <select data-sel="grupo" aria-label="Grupo muscular">
          ${GRUPOS.map(g => `<option ${g === grupoSugestao ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
        <div style="margin-top:6px">${lista}</div>
      </div>`;
  }

  function renderTreino() {
    const alvo = document.getElementById('treino');
    const t = treinoAtivo();
    if (!t) {
      alvo.innerHTML = '<div class="card vazio">Nenhum treino. Crie um abaixo ou restaure o plano padrão.</div>';
      return;
    }
    let total = 0, feitas = 0;
    t.exercicios.forEach(exercicio => { total += exercicio.series; feitas += feitasDoExercicio(exercicio); });

    alvo.innerHTML = `
      <div class="card cabeca">
        <div class="row between">
          <div><h2>${esc(t.nome)}</h2>${t.subtitulo ? `<div class="muted">${esc(t.subtitulo)}</div>` : ''}</div>
          <div class="progresso"><span class="muted">Progresso</span><div><b>${feitas} / ${total} séries</b></div></div>
        </div>
        <div class="row" style="margin-top:12px">
          <button type="button" class="ghost small" data-acao="limpar">Limpar dia</button>
          <button type="button" class="danger small" data-acao="excluir-treino">${rotulo('excluir-treino', 'Excluir treino')}</button>
        </div>
      </div>
      ${painelTroca(t)}
      ${t.exercicios.length ? t.exercicios.map(cardExercicio).join('') : '<div class="card vazio">Nenhum exercício ainda. Adicione abaixo.</div>'}
      <form id="form-ex" class="card form-ex">
        <h3>Adicionar exercício</h3>
        <div class="grid-form">
          <input type="text" name="nome" placeholder="Nome (ex: Supino)" required aria-label="Nome do exercício">
          <select name="grupo" aria-label="Grupo muscular">${GRUPOS.map(g => `<option>${g}</option>`).join('')}</select>
          <input type="text" name="equip" placeholder="Equipamento" value="Máquina" aria-label="Equipamento">
          <input type="number" name="series" min="1" value="3" aria-label="Séries">
          <input type="text" name="reps" value="10-12" aria-label="Repetições">
          <input type="number" name="descanso" min="0" value="90" aria-label="Descanso em segundos">
        </div>
        <button type="submit">Adicionar exercício</button>
      </form>
      ${cardSemEquipamento()}`;
  }

  function renderGeral() {
    document.getElementById('geral').innerHTML = `
      <div class="card">
        <h3>Novo treino</h3>
        <form id="form-treino" class="row">
          <input type="text" id="novo-treino" placeholder="Nome (ex: Treino extra)" required aria-label="Nome do novo treino">
          <button type="submit">Criar</button>
        </form>
        <div class="row between" style="margin-top:14px">
          <span class="muted">Voltar ao plano de 5 dias original</span>
          <button type="button" class="danger small" data-acao="restaurar-plano">${rotulo('restaurar-plano', 'Restaurar plano')}</button>
        </div>
      </div>`;
  }

  // ---------- Ações ----------
  function marcarSerie(exId, idx, descanso) {
    const arr = (estado.marcadas[exId] || []).slice();
    arr[idx] = !arr[idx];
    estado.marcadas[exId] = arr;
    salvarEstado();
    renderTreino();
    if (arr[idx] && descanso > 0) iniciarTimer(descanso);
  }

  function abrirMovimento(exercicio) {
    const spec = exercicio.motion && MOVIMENTOS[exercicio.motion];
    document.getElementById('modal-equip').textContent = exercicio.equip;
    document.getElementById('modal-titulo').textContent = exercicio.nome;
    document.getElementById('modal-setup').textContent = exercicio.setup || 'Sem orientação cadastrada para este exercício.';
    document.getElementById('modal-cue').textContent = exercicio.cue || 'Use a amplitude completa, sem roubar com o tronco.';
    document.getElementById('modal-video').href = exercicio.video || linkBusca(exercicio.nome);
    document.getElementById('modal-svg').innerHTML = spec
      ? `<svg viewBox="0 0 200 120" role="img" aria-label="${esc(spec.label)}">${spec.path}</svg><p class="muted">${esc(spec.label)}</p>`
      : '<p class="muted">Sem animação para este exercício. Use o vídeo.</p>';
    document.getElementById('modal').hidden = false;
  }
  function fecharMovimento() { document.getElementById('modal').hidden = true; }

  function aplicarTroca(i) {
    if (!trocando) return;
    const t = estado.treinos.find(x => x.id === trocando.treinoId);
    const exercicio = t && t.exercicios.find(x => x.id === trocando.exId);
    if (!exercicio) { trocando = null; render(); return; }
    const c = alternativasDe(exercicio)[i];
    if (!c) return;
    exercicio.nome = c[0];
    exercicio.equip = c[1];
    exercicio.motion = c[2];
    exercicio.setup = '';
    exercicio.cue = '';
    exercicio.video = linkBusca(c[0]);
    trocando = null;
    salvarEstado();
    render();
  }

  // Cliques nos treinos (séries, ações dos exercícios, troca, etc.)
  document.getElementById('treino').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.set) { marcarSerie(b.dataset.set, Number(b.dataset.idx), Number(b.dataset.descanso)); return; }
    if (b.dataset.trocarPara != null) { aplicarTroca(Number(b.dataset.trocarPara)); return; }

    const t = treinoAtivo();
    if (!t) return;
    const exercicio = t.exercicios.find(x => x.id === b.dataset.ex);

    switch (b.dataset.acao) {
      case 'limpar':
        t.exercicios.forEach(x => { delete estado.marcadas[x.id]; });
        salvarEstado(); render();
        break;
      case 'excluir-treino':
        confirmar('excluir-treino', () => {
          estado.treinos = estado.treinos.filter(x => x.id !== t.id);
          estado.ativo = estado.treinos[0] ? estado.treinos[0].id : null;
          trocando = null;
          salvarEstado(); render();
        });
        break;
      case 'movimento':
        if (exercicio) abrirMovimento(exercicio);
        break;
      case 'trocar':
        if (exercicio) {
          trocando = { treinoId: t.id, exId: exercicio.id };
          renderTreino();
          document.getElementById('painel-troca')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        break;
      case 'cancelar-troca':
        trocando = null; renderTreino();
        break;
      case 'sem-equip':
        if (GRUPOS.includes(b.dataset.grupo)) grupoSugestao = b.dataset.grupo;
        renderTreino();
        document.getElementById('sem-equip')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        break;
      case 'remover-ex':
        if (exercicio) {
          confirmar('remover-ex:' + exercicio.id, () => {
            t.exercicios = t.exercicios.filter(x => x.id !== exercicio.id);
            delete estado.marcadas[exercicio.id];
            delete estado.cargas[exercicio.id];
            salvarEstado(); render();
          });
        }
        break;
    }
  });

  document.getElementById('treino').addEventListener('input', e => {
    const campo = e.target.closest('[data-carga]');
    if (!campo) return;
    estado.cargas[campo.dataset.carga] = campo.value;
    salvarEstado();
  });

  document.getElementById('treino').addEventListener('change', e => {
    const sel = e.target.closest('[data-sel="grupo"]');
    if (!sel) return;
    grupoSugestao = sel.value;
    document.getElementById('sem-equip').outerHTML = cardSemEquipamento();
  });

  document.getElementById('treino').addEventListener('submit', e => {
    if (e.target.id !== 'form-ex') return;
    e.preventDefault();
    const t = treinoAtivo();
    if (!t) return;
    const f = e.target;
    const nome = f.nome.value.trim();
    if (!nome) return;
    t.exercicios.push({
      id: novoId(), nome, grupo: f.grupo.value,
      equip: f.equip.value.trim() || 'Máquina',
      series: Math.max(1, Number(f.series.value) || 1),
      reps: f.reps.value.trim() || '10-12',
      descanso: Math.max(0, Number(f.descanso.value) || 0),
      motion: null, setup: '', cue: '', video: linkBusca(nome)
    });
    salvarEstado(); render();
  });

  document.getElementById('abas').addEventListener('click', e => {
    const b = e.target.closest('[data-aba]');
    if (!b) return;
    estado.ativo = b.dataset.aba;
    trocando = null;
    salvarEstado(); render();
  });

  document.getElementById('geral').addEventListener('submit', e => {
    if (e.target.id !== 'form-treino') return;
    e.preventDefault();
    const campo = document.getElementById('novo-treino');
    const nome = campo.value.trim();
    if (!nome) return;
    const novo = { id: novoId(), nome, subtitulo: 'Treino personalizado', exercicios: [] };
    estado.treinos.push(novo);
    estado.ativo = novo.id;
    salvarEstado(); render();
  });

  document.getElementById('geral').addEventListener('click', e => {
    const b = e.target.closest('button[data-acao="restaurar-plano"]');
    if (!b) return;
    confirmar('restaurar-plano', () => {
      const personalizados = estado.treinos.filter(t => !PLANO_PADRAO.some(p => p.id === t.id));
      estado.treinos = JSON.parse(JSON.stringify(PLANO_PADRAO)).concat(personalizados);
      estado.ativo = 'd1';
      trocando = null;
      salvarEstado(); render();
    });
  });

  // Modal de movimento
  document.getElementById('modal-fechar').addEventListener('click', fecharMovimento);
  document.getElementById('modal-ok').addEventListener('click', fecharMovimento);
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target.id === 'modal') fecharMovimento();
  });

  // ---------- Início ----------
  estado = carregarEstado();
  if (!treinoAtivo()) estado.ativo = estado.treinos[0] ? estado.treinos[0].id : null;
  marcarPresets();
  desenharTimer();
  render();
</script>
</body>
</html>
